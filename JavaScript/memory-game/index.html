<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Memory Game</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #game {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      gap: 10px;
    }
    .card {
      width: 100px;
      height: 100px;
      background: #444;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      cursor: pointer;
      border-radius: 8px;
    }
    .flipped {
      background: #eee;
      color: black;
    }
  </style>
</head>
<body>

  <h1>Memory Game</h1>
  <p>Moves: <span id="moves">0</span></p>
  <p>Best Score: <span id="best">-</span></p>

  <div id="game"></div>

  <script src="game.js" type="module"></script>

</body>
</html>
