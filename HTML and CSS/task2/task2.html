<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card Component</title>
  <link rel="stylesheet" href="task2.css">
</head>
<body>

  <div class="container">
    <div class="card">
        <div class="badge">Sale</div>
      
        <div class="image-container">
            <img src="headphones.jfif" alt="Wireless Headphones" class="product-image">
        </div>
      
      <h2 class="product-title">Wireless Headphones</h2>
      
      <hr class="divider">
      
      <p class="product-description">
        High-quality wireless headphones with excellent sound and comfort.
      </p>
      
      <hr class="divider">
      
      <div class="product-price">$59.99</div>
      
      <button class="add-to-cart-btn">Add to Cart</button>
      
    </div>
  </div>

</body>
</html>
